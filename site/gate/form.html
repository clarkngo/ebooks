<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Waymark — Unlock request</title>
    <style>
      :root {
        --ink: #142033;
        --muted: #5a6b7d;
        --line: #d5dde8;
        --paper: #ffffff;
        --accent: #2f5bea;
        --accent-deep: #2448c4;
        --font: "Figtree", "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1.25rem 1rem 1.5rem;
        font-family: var(--font);
        color: var(--ink);
        background: var(--paper);
        line-height: 1.45;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .hint {
        margin: 0 0 1.1rem;
        color: var(--muted);
        font-size: 0.92rem;
      }
      label {
        display: block;
        margin: 0.85rem 0 0.35rem;
        font-size: 0.88rem;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        min-height: 2.6rem;
        padding: 0.55rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        font: inherit;
        color: var(--ink);
        background: #f8fafc;
      }
      input:focus,
      select:focus {
        outline: 2px solid rgba(47, 91, 234, 0.35);
        border-color: var(--accent);
        background: #fff;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        min-height: 2.85rem;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-deep);
      }
      .note {
        margin: 1rem 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Get your free guide</h1>
    <p class="hint">We use this only to send the download and occasional playbook updates.</p>
    <form action="thanks.html" method="get">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="role">I am mostly…</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>Choose one</option>
        <option>Team lead / manager</option>
        <option>Independent consultant</option>
        <option>Engineer / builder</option>
        <option>Product / ops</option>
        <option>Something else</option>
      </select>

      <button type="submit">Submit &amp; unlock</button>
    </form>
    <p class="note">One short form. No account required.</p>
  </body>
</html>
