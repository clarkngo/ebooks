<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clark's Ebooks</title>
    <meta
      name="description"
      content="Clark's Ebooks — original fiction from The Last Lithoi and Project Ouroboros. Read online."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#library" id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Clark's Ebooks</span>
      </a>
      <p class="header-note" id="tagline">Original fiction, read in the browser.</p>
    </header>

    <main id="library">
      <div class="intro">
        <p class="intro-kicker">The shelf</p>
        <h1>Two series. Open a cover to begin.</h1>
        <p class="intro-lede">
          Speculative fantasy in the deep strata, and a business novel about runaway agents —
          written by Clark Ngo, readable chapter by chapter.
        </p>
      </div>

      <div id="series-root" aria-live="polite">
        <p class="loading">Loading the shelf…</p>
      </div>
    </main>

    <footer class="site-footer">
      <p>
        Built by
        <a href="https://www.linkedin.com/in/clarkngo/" target="_blank" rel="noopener"
          >Clark Ngo</a
        >
      </p>
    </footer>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
