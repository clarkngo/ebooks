<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clark's Ebooks</title>
    <meta
      name="description"
      content="Clark's Ebooks — original fiction. Browse a title and read online."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="#library" id="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Clark's Ebooks</span>
      </a>
    </header>

    <main>
      <section class="library" id="library">
        <div class="section-head">
          <h1>The shelf</h1>
          <p>Pick a title and read it online — no signup required.</p>
        </div>
        <div class="book-grid" id="book-grid" aria-live="polite">
          <div class="loading">Loading ebooks…</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        Built by
        <a href="https://www.linkedin.com/in/clarkngo/" target="_blank" rel="noopener"
          >Clark Ngo</a
        >
      </p>
    </footer>

    <script src="js/app.js" type="module"></script>
  </body>
</html>
